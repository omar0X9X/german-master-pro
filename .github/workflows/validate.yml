name: Validate German Master Pro

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check js/store.js
          node --check js/engine.js
          node --check js/error-engine.js
          node --check js/ui.js
          node --check js/app.js
          node --check sw.js

      - name: Validate learning data
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const c=JSON.parse(fs.readFileSync("data/curriculum.json","utf8"));
          const q=JSON.parse(fs.readFileSync("data/quizzes.json","utf8"));
          const v=JSON.parse(fs.readFileSync("data/vocabulary.json","utf8"));
          const d=JSON.parse(fs.readFileSync("data/daily-plan.json","utf8"));
          const videos=JSON.parse(fs.readFileSync("data/videos.json","utf8"));
          const grammar=JSON.parse(fs.readFileSync("data/grammar.json","utf8"));
          const zero=JSON.parse(fs.readFileSync("data/zero-path.json","utf8"));
          const studyMethod=JSON.parse(fs.readFileSync("data/study-method.json","utf8"));
          const errorEngine=JSON.parse(fs.readFileSync("data/error-engine.json","utf8"));
          const expected=["A1","A2","B1","B2"];

          if(c.levels.map(x=>x.id).join(",")!==expected.join(",")) throw new Error("Bad curriculum level order");
          if(d.levels.map(x=>x.level).join(",")!==expected.join(",")) throw new Error("Bad daily level order");

          const grammarSections=["alphabet","A1","A2","B1","B2"];
          if(grammar.sections.map(x=>x.id).join(",")!==grammarSections.join(",")) throw new Error("Bad grammar sections");
          const grammarIds=new Set();
          let grammarTopics=0,grammarDrills=0;
          for(const section of grammar.sections){
            if(!section.topics?.length) throw new Error("Empty grammar section "+section.id);
            for(const topic of section.topics){
              grammarTopics++;
              if(grammarIds.has(topic.id)) throw new Error("Duplicate grammar topic "+topic.id);
              grammarIds.add(topic.id);
              if(!topic.title||!topic.summary||!topic.explanation||!topic.mistake) throw new Error("Incomplete grammar topic "+topic.id);
              if(!Array.isArray(topic.examples)||!topic.examples.length) throw new Error("Missing examples "+topic.id);
              if(!topic.drill||!Array.isArray(topic.drill.options)||topic.drill.options.length<3) throw new Error("Missing grammar drill "+topic.id);
              if(topic.drill.answer<0||topic.drill.answer>=topic.drill.options.length) throw new Error("Bad grammar answer "+topic.id);
              grammarDrills++;
            }
          }
          if(grammarTopics<80||grammarDrills!==grammarTopics) throw new Error("Grammar academy too small");
          if(grammar.sections.find(x=>x.id==="alphabet").topics.length<10) throw new Error("Alphabet section too small");
          for(const level of expected){
            if(grammar.sections.find(x=>x.id===level).topics.length<15) throw new Error(level+" grammar section too small");
          }

          const quizzes=new Set(q.quizzes.map(x=>x.id));
          let lessons=0,resources=0;
          for(const level of c.levels){
            for(const m of level.modules){
              if(!quizzes.has(m.quizId)) throw new Error("Missing quiz "+m.quizId);
              m.lessons.forEach(l=>{
                lessons++;
                if(!/^https:\/\//.test(l.url)) throw new Error("Bad lesson URL "+l.id);
                if(!Number.isFinite(l.minutes)) throw new Error("Missing minutes "+l.id);
              });
            }
            level.resources.forEach(r=>{resources++;if(!/^https:\/\//.test(r.url)) throw new Error("Bad resource URL "+r.id)});
          }

          if(lessons<40) throw new Error("Too few lessons");
          if(resources<30) throw new Error("Too few resources");
          if(q.quizzes.length<16) throw new Error("Too few quizzes");
          if(v.cards.length<300) throw new Error("Vocabulary bank must contain at least 300 cards");

          for(const level of expected){
            const count=v.cards.filter(x=>x.level===level).length;
            if(count<70) throw new Error(level+" needs at least 70 vocabulary cards");
          }

          const videoIds=new Set();
          let verifiedMetrics=0;
          for(const video of videos.videos){
            if(videoIds.has(video.id)) throw new Error("Duplicate video "+video.id);
            videoIds.add(video.id);
            if(!expected.includes(video.level)) throw new Error("Bad video level "+video.id);
            if(!/^https:\/\/(www\.)?youtube\.com\/watch\?v=/.test(video.url)) throw new Error("Bad YouTube URL "+video.id);
            if(video.quality?.views||video.quality?.likes) verifiedMetrics++;
          }
          if(videos.videos.length<75) throw new Error("Video library too small");
          if(verifiedMetrics<20) throw new Error("Not enough verified engagement snapshots");

          if(!Array.isArray(zero.letters)||zero.letters.length<30) throw new Error("Foundation alphabet must have 30 letters/symbols");
          if(!Array.isArray(zero.clusters)||zero.clusters.length<18) throw new Error("Foundation sound clusters too small");
          if(!Array.isArray(zero.steps)||zero.steps.length<18) throw new Error("Foundation path must have at least 18 steps");
          const zeroStepIds=new Set();
          zero.steps.forEach((step,index)=>{
            if(step.id!==("zero-"+String(index+1).padStart(2,"0"))) throw new Error("Foundation step order mismatch "+step.id);
            if(zeroStepIds.has(step.id)) throw new Error("Duplicate foundation step "+step.id);
            zeroStepIds.add(step.id);
            if(!step.title||!step.goal||!Number.isFinite(step.minutes)) throw new Error("Incomplete foundation step "+step.id);
            if(step.videoId&&!videoIds.has(step.videoId)) throw new Error("Unknown foundation video "+step.videoId);
            if(step.grammarIds) for(const id of step.grammarIds) if(!grammarIds.has(id)) throw new Error("Unknown foundation grammar "+id);
            if(step.type==="checkpoint"){
              if(!Array.isArray(step.quiz)||step.quiz.length<6) throw new Error("Checkpoint too small "+step.id);
              step.quiz.forEach(q=>{
                if(!Array.isArray(q.o)||q.o.length<3||q.a<0||q.a>=q.o.length) throw new Error("Bad checkpoint question "+step.id);
              });
            }
          });

          if(errorEngine.levels.map(x=>x.level).join(",")!==expected.join(",")) throw new Error("Bad Error Engine level order");
          const errorSkillIds=new Map();
          for(const level of errorEngine.levels){
            if(!Array.isArray(level.skills)||level.skills.length<8) throw new Error(level.level+" needs 8 error skills");
            const ids=new Set();
            for(const skill of level.skills){
              if(!skill.id||!skill.title||!skill.description) throw new Error("Incomplete error skill "+level.level);
              if(ids.has(skill.id)) throw new Error("Duplicate error skill "+level.level+" "+skill.id);
              ids.add(skill.id);
            }
            errorSkillIds.set(level.level,ids);
          }
          const exerciseIds=new Set(),types=new Set(["cloze","reorder","correct","dictation"]);
          for(const ex of errorEngine.exercises){
            if(exerciseIds.has(ex.id)) throw new Error("Duplicate error exercise "+ex.id);
            exerciseIds.add(ex.id);
            if(!expected.includes(ex.level)) throw new Error("Bad error exercise level "+ex.id);
            if(!errorSkillIds.get(ex.level)?.has(ex.skill)) throw new Error("Unknown error skill "+ex.id);
            if(!types.has(ex.type)) throw new Error("Bad error exercise type "+ex.id);
            if(!ex.prompt||!ex.answer||!ex.hint||!ex.explain) throw new Error("Incomplete error exercise "+ex.id);
            if(ex.type==="reorder"&&(!Array.isArray(ex.words)||ex.words.length<3)) throw new Error("Reorder missing words "+ex.id);
            if(ex.type==="dictation"&&!ex.audio) throw new Error("Dictation missing audio "+ex.id);
          }
          if(errorEngine.exercises.length<96) throw new Error("Error Engine exercise bank too small");
          for(const level of expected){
            const count=errorEngine.exercises.filter(x=>x.level===level).length;
            if(count<24) throw new Error(level+" needs at least 24 error exercises");
          }

          if(!Array.isArray(studyMethod.sources)||studyMethod.sources.length<8) throw new Error("Smart notebook needs at least 8 source methods");
          const requiredMethods=["video","grammar","reading","listening","vocab","writing","speaking","review"];
          for(const id of requiredMethods){
            const src=studyMethod.sources.find(x=>x.id===id);
            if(!src) throw new Error("Missing notebook method "+id);
            if(!src.goal||!src.before?.length||!src.during?.length||!src.after?.length||!src.template?.length||!src.avoid) throw new Error("Incomplete notebook method "+id);
          }
          if(!studyMethod.pageExample?.lines?.length) throw new Error("Missing notebook example");
          if(!studyMethod.weekly?.tasks?.length) throw new Error("Missing weekly notebook review");

          const vocabIds=new Set(v.cards.map(x=>x.id));
          let dailyCount=0,readingChars=0,speakingTasks=0,listeningTasks=0,grammarDaily=0;
          for(const level of d.levels){
            if(level.durationDays!==30||level.days.length!==30) throw new Error(level.level+" must have 30 days");
            level.days.forEach((day,index)=>{
              dailyCount++;
              if(day.day!==index+1) throw new Error(level.level+" day order mismatch");
              if(!day.videos?.length) throw new Error("Missing daily video "+level.level+" day "+day.day);
              for(const id of day.videos) if(!videoIds.has(id)) throw new Error("Unknown daily video "+id);

              if(!day.grammarId||!grammarIds.has(day.grammarId)) throw new Error("Bad daily grammar "+level.level+" day "+day.day);
              grammarDaily++;

              if(!day.listening?.videoId||!videoIds.has(day.listening.videoId)) throw new Error("Bad listening task "+level.level+" day "+day.day);
              if(!Array.isArray(day.listening.steps)||day.listening.steps.length<3) throw new Error("Listening needs 3 steps");
              listeningTasks++;

              if(!day.reading?.text||day.reading.text.length<80) throw new Error("Reading too short "+level.level+" day "+day.day);
              readingChars+=day.reading.text.length;
              if(!Array.isArray(day.reading.checks)||day.reading.checks.length<3) throw new Error("Reading checks missing");
              for(const x of day.reading.checks) if(!x.q||!x.a) throw new Error("Incomplete reading self-check");

              if(!day.writing?.prompt||!Number.isFinite(day.writing.minWords)) throw new Error("Writing task missing");
              if(!Array.isArray(day.writing.checklist)||day.writing.checklist.length<3) throw new Error("Writing checklist missing");

              if(!day.speaking?.prompt||!Number.isFinite(day.speaking.targetSeconds)) throw new Error("Speaking task missing");
              if(!Array.isArray(day.speaking.checklist)||day.speaking.checklist.length<3) throw new Error("Speaking checklist missing");
              speakingTasks++;

              if(!Array.isArray(day.vocabIds)||day.vocabIds.length<7) throw new Error("Daily vocabulary must have 7 cards");
              for(const id of day.vocabIds) if(!vocabIds.has(id)) throw new Error("Unknown vocab id "+id);
            });
          }
          if(dailyCount!==120) throw new Error("Expected 120 study days");
          if(listeningTasks!==120||speakingTasks!==120||grammarDaily!==120) throw new Error("Every day needs grammar, listening and speaking");

          const questionIds=new Set();
          for(const quiz of q.quizzes) for(const question of quiz.questions){
            if(questionIds.has(question.id)) throw new Error("Duplicate question "+question.id);
            questionIds.add(question.id);
            if(question.answer<0||question.answer>=question.options.length) throw new Error("Bad answer "+question.id);
          }

          console.log({
            levels:expected,lessons,resources,
            quizzes:q.quizzes.length,questions:questionIds.size,
            vocabulary:v.cards.length,videos:videos.videos.length,
            engagementSnapshots:verifiedMetrics,
            grammarTopics,grammarDrills,grammarDaily,
            dailyDays:dailyCount,listeningTasks,speakingTasks,readingCharacters:readingChars
          });
          NODE

      - name: Validate app contract
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f assets/icon.svg
          test -f data/daily-plan.json
          test -f data/videos.json
          test -f data/grammar.json
          test -f data/zero-path.json
          test -f data/study-method.json
          test -f data/error-engine.json
          test -f js/error-engine.js
          grep -q 'data-panel="daily"' index.html
          grep -q 'data-panel="grammar"' index.html
          grep -q 'data-panel="errors"' index.html
          grep -q 'id="errorLockPanel"' index.html
          grep -q 'id="errorSkillGrid"' index.html
          grep -q 'id="errorExerciseArea"' index.html
          grep -q 'id="errorNotebookList"' index.html
          grep -q 'id="manualErrorForm"' index.html
          grep -q 'id="dailyGrammarDone"' index.html
          grep -q 'id="grammarSearch"' index.html
          grep -q 'id="grammarTopics"' index.html
          grep -q 'id="zeroStepList"' index.html
          grep -q 'id="zeroStepContent"' index.html
          grep -q 'id="dailyNotebookGuide"' index.html
          grep -q 'id="copyNotebookTemplate"' index.html
          grep -q 'id="notebookSourceTabs"' index.html
          grep -q 'id="notebookSourceContent"' index.html
          grep -q 'id="copyMasterNotebookTemplate"' index.html
          grep -q 'G.grammarProgress' js/store.js
          grep -q 'G.ui.renderGrammar' js/ui.js
          grep -q 'G.ui.renderErrorEngine' js/ui.js
          grep -q 'G.captureQuizAnswer' js/ui.js
          grep -q 'G.ui.renderZeroPath' js/ui.js
          grep -q 'G.ui.renderNotebookAcademy' js/ui.js
          grep -q 'speechSynthesis' js/ui.js
          grep -q 'G.zeroProgress' js/store.js
          grep -q 'G.errorUnlockStatus' js/error-engine.js
          grep -q 'G.errorLevelStats' js/error-engine.js
          grep -q 'G.recordErrorAttempt' js/error-engine.js
          grep -q 'G.addManualError' js/error-engine.js
          grep -q 'globalUnlocked=zero.total>0&&zero.pct===100&&a1.total>0&&a1.pct===100' js/error-engine.js
          grep -q 'G.ui.renderDaily' js/ui.js
          grep -q 'grammar.json' js/app.js
          grep -q 'zero-path.json' js/app.js
          grep -q 'study-method.json' js/app.js
          grep -q 'error-engine.json' js/app.js
          grep -q 'grammar.json' sw.js
          grep -q 'zero-path.json' sw.js
          grep -q 'study-method.json' sw.js
          grep -q 'error-engine.json' sw.js
          grep -q 'error-engine.js' sw.js
          grep -q 'serviceWorker' js/app.js
          node - <<'NODE'
          const fs=require("fs");
          const s=fs.readFileSync("js/ui.js","utf8");
          const bad=/(^|[^$])\$\([^)]*\)\.forEach/g;
          const match=bad.exec(s);
          if(match) throw new Error("Single-element $() selector used with .forEach near: "+match[0].slice(0,120));
          NODE
