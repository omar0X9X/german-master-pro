name: Validate German Master Pro

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check js/store.js
          node --check js/engine.js
          node --check js/ui.js
          node --check js/app.js
          node --check sw.js

      - name: Validate learning data
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const c=JSON.parse(fs.readFileSync("data/curriculum.json","utf8"));
          const q=JSON.parse(fs.readFileSync("data/quizzes.json","utf8"));
          const v=JSON.parse(fs.readFileSync("data/vocabulary.json","utf8"));
          const d=JSON.parse(fs.readFileSync("data/daily-plan.json","utf8"));
          const videos=JSON.parse(fs.readFileSync("data/videos.json","utf8"));
          const expected=["A1","A2","B1","B2"];

          if(c.levels.map(x=>x.id).join(",")!==expected.join(",")) throw new Error("Bad curriculum level order");
          if(d.levels.map(x=>x.level).join(",")!==expected.join(",")) throw new Error("Bad daily level order");

          const quizzes=new Set(q.quizzes.map(x=>x.id));
          let lessons=0,resources=0;
          for(const level of c.levels){
            for(const m of level.modules){
              if(!quizzes.has(m.quizId)) throw new Error("Missing quiz "+m.quizId);
              m.lessons.forEach(l=>{
                lessons++;
                if(!/^https:\/\//.test(l.url)) throw new Error("Bad lesson URL "+l.id);
                if(!Number.isFinite(l.minutes)) throw new Error("Missing minutes "+l.id);
              });
            }
            level.resources.forEach(r=>{resources++;if(!/^https:\/\//.test(r.url)) throw new Error("Bad resource URL "+r.id)});
          }

          if(lessons<40) throw new Error("Too few lessons");
          if(resources<30) throw new Error("Too few resources");
          if(q.quizzes.length<16) throw new Error("Too few quizzes");
          if(v.cards.length<300) throw new Error("Vocabulary bank must contain at least 300 cards");

          for(const level of expected){
            const count=v.cards.filter(x=>x.level===level).length;
            if(count<70) throw new Error(level+" needs at least 70 vocabulary cards");
          }

          const videoIds=new Set();
          let verifiedMetrics=0;
          for(const video of videos.videos){
            if(videoIds.has(video.id)) throw new Error("Duplicate video "+video.id);
            videoIds.add(video.id);
            if(!expected.includes(video.level)) throw new Error("Bad video level "+video.id);
            if(!/^https:\/\/(www\.)?youtube\.com\/watch\?v=/.test(video.url)) throw new Error("Bad YouTube URL "+video.id);
            if(video.quality?.views||video.quality?.likes) verifiedMetrics++;
          }
          if(videos.videos.length<75) throw new Error("Video library too small");
          if(verifiedMetrics<20) throw new Error("Not enough verified engagement snapshots");

          const vocabIds=new Set(v.cards.map(x=>x.id));
          let dailyCount=0,readingChars=0,speakingTasks=0,listeningTasks=0;
          for(const level of d.levels){
            if(level.durationDays!==30||level.days.length!==30) throw new Error(level.level+" must have 30 days");
            level.days.forEach((day,index)=>{
              dailyCount++;
              if(day.day!==index+1) throw new Error(level.level+" day order mismatch");
              if(!day.videos?.length) throw new Error("Missing daily video "+level.level+" day "+day.day);
              for(const id of day.videos) if(!videoIds.has(id)) throw new Error("Unknown daily video "+id);

              if(!day.listening?.videoId||!videoIds.has(day.listening.videoId)) throw new Error("Bad listening task "+level.level+" day "+day.day);
              if(!Array.isArray(day.listening.steps)||day.listening.steps.length<3) throw new Error("Listening needs 3 steps");
              listeningTasks++;

              if(!day.reading?.text||day.reading.text.length<80) throw new Error("Reading too short "+level.level+" day "+day.day);
              readingChars+=day.reading.text.length;
              if(!Array.isArray(day.reading.checks)||day.reading.checks.length<3) throw new Error("Reading checks missing");
              for(const x of day.reading.checks) if(!x.q||!x.a) throw new Error("Incomplete reading self-check");

              if(!day.writing?.prompt||!Number.isFinite(day.writing.minWords)) throw new Error("Writing task missing");
              if(!Array.isArray(day.writing.checklist)||day.writing.checklist.length<3) throw new Error("Writing checklist missing");

              if(!day.speaking?.prompt||!Number.isFinite(day.speaking.targetSeconds)) throw new Error("Speaking task missing");
              if(!Array.isArray(day.speaking.checklist)||day.speaking.checklist.length<3) throw new Error("Speaking checklist missing");
              speakingTasks++;

              if(!Array.isArray(day.vocabIds)||day.vocabIds.length<7) throw new Error("Daily vocabulary must have 7 cards");
              for(const id of day.vocabIds) if(!vocabIds.has(id)) throw new Error("Unknown vocab id "+id);
            });
          }
          if(dailyCount!==120) throw new Error("Expected 120 study days");
          if(listeningTasks!==120||speakingTasks!==120) throw new Error("Every day needs listening and speaking");

          const questionIds=new Set();
          for(const quiz of q.quizzes) for(const question of quiz.questions){
            if(questionIds.has(question.id)) throw new Error("Duplicate question "+question.id);
            questionIds.add(question.id);
            if(question.answer<0||question.answer>=question.options.length) throw new Error("Bad answer "+question.id);
          }

          console.log({
            levels:expected,lessons,resources,
            quizzes:q.quizzes.length,questions:questionIds.size,
            vocabulary:v.cards.length,videos:videos.videos.length,
            engagementSnapshots:verifiedMetrics,
            dailyDays:dailyCount,listeningTasks,speakingTasks,readingCharacters:readingChars
          });
          NODE

      - name: Validate app contract
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f assets/icon.svg
          test -f data/daily-plan.json
          test -f data/videos.json
          grep -q 'data-panel="daily"' index.html
          grep -q 'id="dailyListeningDone"' index.html
          grep -q 'id="dailyWritingArea"' index.html
          grep -q 'id="dailySpeakingDone"' index.html
          grep -q 'id="recordSpeakingButton"' index.html
          grep -q 'id="dailyReadingAnswers"' index.html
          grep -q 'G.todayDaily' js/engine.js
          grep -q 'G.ui.renderDaily' js/ui.js
          grep -q 'MediaRecorder' js/ui.js
          grep -q 'daily-plan.json' js/app.js
          grep -q 'serviceWorker' js/app.js
          if grep -q '\$("#daily[^"]*"\)\.forEach' js/ui.js; then
            echo "Found incorrect single-element selector used with forEach"
            exit 1
          fi
