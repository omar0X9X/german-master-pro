name: Static site checks

on:
  pull_request:
    paths:
      - "static-site/**"
      - ".github/workflows/static-site-check.yml"
  push:
    branches: ["main"]
    paths:
      - "static-site/**"
      - ".github/workflows/static-site-check.yml"

permissions:
  contents: read

jobs:
  verify-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check static-site/app.js

      - name: Validate curriculum JSON
        run: node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('static-site/data/curriculum.json','utf8')); if(!Array.isArray(d.levels)||d.levels.length!==4) process.exit(1); console.log('levels:', d.levels.map(x=>x.id).join(','));"

      - name: Check required files
        run: |
          test -f static-site/index.html
          test -f static-site/styles.css
          test -f static-site/app.js
          test -f static-site/data/curriculum.json
