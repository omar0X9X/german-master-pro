name: Static site checks

on:
  pull_request:
    paths:
      - "static-site/**"
      - ".github/workflows/static-site-check.yml"
  push:
    branches: ["main"]
    paths:
      - "static-site/**"
      - ".github/workflows/static-site-check.yml"

permissions:
  contents: read

jobs:
  verify-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check static-site/app.js

      - name: Validate smart curriculum
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('static-site/data/curriculum.json','utf8'));
          const expected = ['A1','A2','B1','B2'];

          if (!Array.isArray(data.levels) || data.levels.map(x => x.id).join(',') !== expected.join(',')) {
            throw new Error('Expected A1,A2,B1,B2');
          }

          let videos = 0;
          let practice = 0;

          for (const level of data.levels) {
            if (!Array.isArray(level.lessons) || level.lessons.length < 8) {
              throw new Error(level.id + ' needs an ordered video track');
            }

            level.lessons.forEach((lesson, index) => {
              if (lesson.order !== index + 1) throw new Error(level.id + ' lesson order mismatch');
              if (!/^https:\/\/(www\.)?youtube\.com\/watch\?v=/.test(lesson.url)) {
                throw new Error('Invalid YouTube URL: ' + lesson.url);
              }
            });

            if (!Array.isArray(level.resources) || level.resources.length < 5) {
              throw new Error(level.id + ' needs practice resources');
            }

            videos += level.lessons.length;
            practice += level.resources.length;
          }

          if (videos < 47) throw new Error('Expected at least 47 ordered videos');
          if (practice < 36) throw new Error('Expected at least 36 practice resources');

          console.log({ levels: expected, orderedVideos: videos, practiceResources: practice });
          NODE

      - name: Validate Study Engine UI
        run: |
          grep -q 'id="smartHub"' static-site/index.html
          grep -q 'id="dailyMinutes"' static-site/index.html
          grep -q 'id="todayPlan"' static-site/index.html
          grep -q 'function buildTodayPlan' static-site/app.js
          grep -q 'function dueReviews' static-site/app.js
          grep -q 'function streak' static-site/app.js

      - name: Check required files
        run: |
          test -f static-site/index.html
          test -f static-site/styles.css
          test -f static-site/app.js
          test -f static-site/data/curriculum.json
          test -f static-site/README.md
